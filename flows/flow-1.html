<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jordy's - Post Visit Flow</title>
<style>
  a[href*="view"], .view-online, .browser-link {
    display: none !important;
    visibility: hidden !important;
    mso-hide: all;
  }
  body { margin: 0 !important; padding: 0 !important; background: #ffffff; font-family: Georgia, serif; }
  * { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
  table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; border-collapse: collapse; }
  img { border: 0; outline: none; text-decoration: none; display: block; -ms-interpolation-mode: bicubic; }
  div[style*="margin: 16px 0"] { margin: 0 !important; }
</style>
</head>
<body>

<div style="max-width: 600px; margin: 0 auto; background: #ffffff;">

  <!-- LOGO -->
  <div style="background: #ffffff; padding: 32px 40px; text-align: center;">
    <img src="https://images.squarespace-cdn.com/content/5ee715c4af5f2c14ccec67c1/317e50bc-7c51-4b6d-a7ae-2de7384b635f/JORDYS_LOGO_EMAIL.png?content-type=image%2Fpng" alt="Jordy's" style="height: 100px; width: auto; display: inline-block;" />
  </div>

  <!-- FULL BLEED IMAGE — landscape -->
  <div style="font-size: 0; line-height: 0; overflow: hidden;">
    <img src="https://images.squarespace-cdn.com/content/5ee715c4af5f2c14ccec67c1/ebdb64ab-770a-43df-8168-aea24f26d593/MARGI-3.png?content-type=image%2Fpng" alt="Jordy's" width="600" style="width: 100%; height: 380px; object-fit: cover; object-position: center; display: block;" />
  </div>

  <!-- TERRACOTTA CTA BANNER -->
  <div style="background: #c2724c; padding: 16px 20px;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td style="text-align: center; padding: 0 8px;">
          <a href="https://bookings.nowbookit.com?accountid=933ec4b6-ecbc-4f71-bb42-cd00e0176c00&colors=hex%2Cc2724c&font=Lato&theme=light&venueid=10578" style="color: #ffffff; font-family: Georgia, serif; font-size: 13px; font-weight: 700; text-decoration: none; letter-spacing: 0.5px; white-space: nowrap;">Book a table</a>
        </td>
        <td style="text-align: center; color: rgba(255,255,255,0.4); font-size: 13px; width: 12px;">|</td>
        <td style="text-align: center; padding: 0 8px;">
          <a href="https://www.meandu.app/jordys/pickup" style="color: #ffffff; font-family: Georgia, serif; font-size: 13px; font-weight: 700; text-decoration: none; letter-spacing: 0.5px; white-space: nowrap;">Order online</a>
        </td>
        <td style="text-align: center; color: rgba(255,255,255,0.4); font-size: 13px; width: 12px;">|</td>
        <td style="text-align: center; padding: 0 8px;">
          <a href="https://jordyscasuarina.com/menu" style="color: #ffffff; font-family: Georgia, serif; font-size: 13px; font-weight: 700; text-decoration: none; letter-spacing: 0.5px; white-space: nowrap;">View the menu</a>
        </td>
      </tr>
    </table>
  </div>

  <!-- DIVIDER -->
  <div style="height: 1px; background: rgba(194,114,76,0.2); margin: 0 40px;"></div>

  <!-- BODY COPY -->
  <div style="padding: 36px 40px 0;">
    <p style="font-size: 15px; color: rgba(26,26,26,0.45); font-family: Georgia, serif; line-height: 1.85; margin: 0 0 16px; padding: 0;">Hey [First Name],</p>
    <p style="font-size: 15px; color: #1a1a1a; font-family: Georgia, serif; line-height: 1.85; margin: 0 0 16px; padding: 0;">You just ate here.</p>
    <p style="font-size: 15px; color: #1a1a1a; font-family: Georgia, serif; line-height: 1.85; margin: 0 0 16px; padding: 0;">If you're being honest, you'd do it again this week.</p>
    <p style="font-size: 15px; color: #1a1a1a; font-family: Georgia, serif; line-height: 1.85; margin: 0 0 16px; padding: 0;">Midweek's better anyway. $10 beer, wine and margaritas. Less people.</p>
  </div>

  <!-- CTA -->
  <div style="padding: 24px 40px 40px;">
    <a href="https://bookings.nowbookit.com?accountid=933ec4b6-ecbc-4f71-bb42-cd00e0176c00&colors=hex%2Cc2724c&font=Lato&theme=light&venueid=10578" style="display: block; background: #c2724c; color: #ffffff; font-family: Georgia, serif; font-size: 14px; font-weight: 700; letter-spacing: 0.5px; padding: 15px 0; text-decoration: none; border-radius: 2px; text-align: center;">Book again</a>
  </div>

  <!-- SIGN OFF -->
  <div style="margin: 0 40px; border-top: 1px solid rgba(26,26,26,0.1); padding: 28px 0;">
    <p style="font-size: 14px; color: rgba(26,26,26,0.4); font-family: Georgia, serif; line-height: 1.8; margin: 0 0 2px; padding: 0;">Eat the crust,</p>
    <p style="font-size: 22px; color: #c2724c; font-family: Georgia, serif; font-weight: 700; margin: 0; padding: 0; line-height: 1.3;">Jordy</p>
  </div>

</div>
</body>
</html>
