<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Campaign preview</title>
</head>
<body>
<style>
  a[href*="view"], .view-online, .browser-link {
    display: none !important;
    visibility: hidden !important;
    mso-hide: all;
  }
  body { margin: 0 !important; padding: 0 !important; background: #ffffff; font-family: Arial, Helvetica, sans-serif; }
  * { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
  table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; border-collapse: collapse; }
  img { border: 0; outline: none; text-decoration: none; display: block; -ms-interpolation-mode: bicubic; }
  @media only screen and (max-width: 600px) {
    .cta-img { width: 100px !important; }
  }
</style>

<div style="max-width: 600px; margin: 0 auto; background: #ffffff;">

  <!-- LOGO -->
  <div style="background: #ffffff; padding: 20px 40px 16px; border-bottom: 1px solid #f0ebe6;">
    <img src="https://images.squarespace-cdn.com/content/5ee715c4af5f2c14ccec67c1/317e50bc-7c51-4b6d-a7ae-2de7384b635f/JORDYS_LOGO_EMAIL.png?content-type=image%2Fpng" alt="Jordy's" style="height: 40px; width: auto; display: block;" />
  </div>

  <!-- OVERSIZED HEADLINE -->
  <div style="padding: 44px 40px 0;">
    <p style="font-size: 11px; color: #c2724c; font-family: Arial, Helvetica, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; margin: 0 0 16px; padding: 0;">THIS WEEK'S SPECIAL</p>
    <p style="font-size: 40px; color: #1a1a1a; font-family: Georgia, serif; font-weight: 700; line-height: 1.05; margin: 0; padding: 0;">the coopers<br>shoot is<br>back.</p>
  </div>

  <!-- TERRACOTTA RULE -->
  <div style="margin: 28px 40px 0;">
    <div style="width: 48px; height: 3px; background: #c2724c;"></div>
  </div>

  <!-- BODY COPY -->
  <div style="padding: 20px 40px 0;">
    <p style="font-size: 14px; color: #1a1a1a; font-family: Arial, Helvetica, sans-serif; line-height: 1.9; margin: 0 0 14px; padding: 0; font-weight: 700;">Hey [First Name],</p>
    <p style="font-size: 15px; color: #c2724c; font-family: Arial, Helvetica, sans-serif; line-height: 1.85; margin: 0 0 14px; padding: 0;">Heirloom tomatoes. Mascarpone bianco. Napoli. Rocket pesto. Prosciutto.</p>
    <p style="font-size: 15px; color: #1a1a1a; font-family: Arial, Helvetica, sans-serif; line-height: 1.85; margin: 0 0 14px; padding: 0;">A short run of one of our favourite pizzas.</p>
    <p style="font-size: 15px; color: #1a1a1a; font-family: Arial, Helvetica, sans-serif; line-height: 1.85; margin: 0; padding: 0;">Here for now. Not forever.</p>
  </div>

  <!-- PIZZA IMAGE -->
  <div style="padding: 28px 0 0; font-size: 0; line-height: 0;">
    <img src="https://images.squarespace-cdn.com/content/5ee715c4af5f2c14ccec67c1/9c2a1bd7-be8d-47d5-8ba1-2d6c3a4c0687/ChatGPT+Image+May+19%2C+2026%2C+10_57_54+AM.png?content-type=image%2Fpng" alt="Coopers Shoot" style="width: 100%; max-width: 600px; height: 480px; object-fit: cover; object-position: center 50%; display: block;" />
  </div>

  <!-- IMAGE CTAs -->
  <div style="padding: 28px 40px 0; text-align: center;">
    <table width="95%" cellpadding="0" cellspacing="0" border="0" align="center">
      <tr>
        <td style="padding-right: 12px;">
          <a href="https://bookings.nowbookit.com?accountid=933ec4b6-ecbc-4f71-bb42-cd00e0176c00&colors=hex%2Cc2724c&font=Lato&theme=light&venueid=10578" style="display: block;">
            <img src="https://images.squarespace-cdn.com/content/5ee715c4af5f2c14ccec67c1/11c66013-eeed-475a-80ea-3dbac14c1c6a/CTA-BOOK.png?content-type=image%2Fpng" alt="Book a table" width="170" style="width: 170px; height: auto; display: block;" />
          </a>
        </td>
        <td style="padding-right: 12px;">
          <a href="https://www.meandu.app/jordys/pickup" style="display: block;">
            <img src="https://images.squarespace-cdn.com/content/5ee715c4af5f2c14ccec67c1/f50ac228-5787-45a0-b4a3-d56165b68a40/CTA-ORDER.png?content-type=image%2Fpng" alt="Order online" width="170" style="width: 170px; height: auto; display: block;" />
          </a>
        </td>
        <td>
          <a href="https://jordyscasuarina.com/menu" style="display: block;">
            <img src="https://images.squarespace-cdn.com/content/5ee715c4af5f2c14ccec67c1/2efaedf8-7f7d-4ae0-a474-b82c89b489d6/CTA-MENU.png?content-type=image%2Fpng" alt="View the menu" width="170" style="width: 170px; height: auto; display: block;" />
          </a>
        </td>
      </tr>
    </table>
  </div>

  <!-- SIGN OFF -->
  <div style="margin: 28px 40px 0; border-top: 1px solid #f0ebe6; padding: 24px 0 32px;">
    <p style="font-size: 12px; color: rgba(26,26,26,0.35); font-family: Arial, Helvetica, sans-serif; margin: 0 0 4px; padding: 0;">eat your crust,</p>
    <p style="font-size: 36px; color: #c2724c; font-family: Georgia, serif; font-weight: 700; margin: 0; padding: 0; line-height: 1.1;">Jordy</p>
  </div>

</div>

</html>
