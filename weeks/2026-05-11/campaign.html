<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Campaign placeholder</title>
<style>
  body {
    font-family: 'Lato', -apple-system, sans-serif;
    background: #faf8f6;
    color: #888;
    margin: 0;
    padding: 40px 24px;
    text-align: center;
  }
  .ph-mark {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #c2724c;
    margin-bottom: 12px;
  }
  .ph-title {
    font-size: 18px;
    font-weight: 900;
    color: #1a1a1a;
    margin-bottom: 8px;
  }
  .ph-sub {
    font-size: 13px;
    line-height: 1.6;
    max-width: 460px;
    margin: 0 auto;
  }
  code {
    background: #fff;
    padding: 2px 8px;
    border: 1px solid #e8e0db;
    border-radius: 3px;
    font-size: 12px;
    color: #444;
  }
</style>
</head>
<body>
  <div class="ph-mark">Awaiting campaign</div>
  <div class="ph-title">Email campaign preview</div>
  <div class="ph-sub">
    Replace <code>campaign.html</code> in this folder with the TalkBox campaign HTML.
    The preview will render here automatically.
  </div>
</body>
</html>
